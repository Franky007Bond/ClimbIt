name: climbit

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-climbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-climbit}
      POSTGRES_DB: ${POSTGRES_DB:-climbit}
    volumes:
      - climbit_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "climbit", "-d", "climbit"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 40s

  api:
    build:
      context: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://climbit:climbit@db:5432/climbit}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      MAINTAINER_SESSION_SECRET: ${MAINTAINER_SESSION_SECRET:-local-dev-maintainer-secret}
      TRIP_CAPABILITY_SECRET: ${TRIP_CAPABILITY_SECRET:-local-dev-trip-capability-secret}
      MAINTAINER_ALLOWLIST: ${MAINTAINER_ALLOWLIST:-[]}
      WIKI_ANONYMOUS_EDIT_RATE_LIMIT_MAX: ${WIKI_ANONYMOUS_EDIT_RATE_LIMIT_MAX:-20}
      WIKI_ANONYMOUS_EDIT_RATE_LIMIT_WINDOW_SECONDS: ${WIKI_ANONYMOUS_EDIT_RATE_LIMIT_WINDOW_SECONDS:-3600}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  climbit_db_data:
    name: climbit_db_data
