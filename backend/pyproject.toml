[project]
name = "climbit-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.156.8",
    "geoalchemy2>=0.20.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "jsonschema>=4.25.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
markers = [
    "integration: tests that require PostgreSQL (DATABASE_URL)",
    "contract: OpenAPI contract and committed spec checks",
]

[tool.ruff.lint]
ignore = ["E402", "E501", "E741"]
